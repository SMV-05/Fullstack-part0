name: Periodic Health Check

on:
  schedule:
    # Run once every 24 hours at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  health_check:
    runs-on: ubuntu-20.04
    steps:
      - name: Check endpoint health
        uses: jasonetco/action-http-request@v1
        with:
          url: 'https://fullstack-part0.onrender.com/health'
          method: 'GET'
          expected-status: '200'

      - name: Discord Notification on Failure
        uses: rjstone/discord-webhook-notify@v1
        if: ${{ failure() && env.DISCORD_WEBHOOK != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          severity: error
          details: Pokédex health check failed! The service might be down.
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
